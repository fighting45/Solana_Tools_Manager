services:
  - type: web
    name: spl-token-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SOLANA_RPC_URL
        sync: false
      - key: PINATA_API_KEY
        sync: false
      - key: PINATA_SECRET_API_KEY
        sync: false
      - key: PLATFORM_WALLET
        value: A1YrqK6SUgr1mKDLx88sy992BCx4EAGSkbAsre34tgPz
      - key: PLATFORM_FEE
        value: 0.05
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
