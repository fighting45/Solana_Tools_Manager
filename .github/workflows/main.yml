name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # adjust to your node version

      - name: Install dependencies
        run: npm ci # or npm install, as per your repo

      - name: Run ESLint & Prettier checks
        run: |
          npx eslint . --fix --max-warnings 0
          npx prettier --write .
          npx eslint . --max-warnings 0
          npx prettier --check .

  deploy1:
    name: "Deploy to VPS(CI)"
    needs: lint # ensures this job runs only if lint passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend with REACT_APP_API_URL
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          echo "Building frontend with REACT_APP_API_URL=$REACT_APP_API_URL"
          cd frontend
          npm ci
          # CRA reads REACT_APP_* at build time
          REACT_APP_API_URL="${REACT_APP_API_URL}" npm run build
          # move back to repo root
          cd ..
      - name: Install SSH Client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to VPS(CI)
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -r . $SERVER_USER@$SERVER_IP:/tmp/sol_tool_manager
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          echo '--- Copying sol_tool_manager to /mnt/sol_tool_manager ---'
          rm -rf /mnt/sol_tool_manager
          mkdir -p /mnt/sol_tool_manager
          cp -r /tmp/sol_tool_manager/* /mnt/sol_tool_manager
          BACKEND_DIR="/mnt/sol_tool_manager"
          FRONTEND_DIR="/mnt/sol_tool_manager/frontend"
          echo '--- Build docker image for Frontend ---'
          docker build --no-cache -t sol_tool_manager_frontend "$FRONTEND_DIR"
          docker network create sol_net || true
          echo '--- Build docker image for Backend ---'
          docker build --no-cache -t sol_tool_manager_backend "$BACKEND_DIR"
          EOF
  deploy2:
    name: "Deploy to VPS(CD)"
    needs: deploy1 # ensures this job runs only if lint passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SSH Client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to VPS(CD)
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PLATFORM_FEE: ${{ secrets.PLATFORM_FEE }}
          PLATFORM_WALLET: ${{ secrets.PLATFORM_WALLET }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: |
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -r . $SERVER_USER@$SERVER_IP:/tmp/sol_tool_manager
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
          docker images
          docker stop sol_frontend || true
          docker rm sol_frontend || true
          docker stop sol_backend || true
          docker rm sol_backend || true
          docker run -d --restart always --name sol_frontend -p 5000:3000 -e REACT_APP_API_URL="${REACT_APP_API_URL}" sol_tool_manager_frontend
          docker run -d --restart always --name sol_backend -p 5001:3001 -e PINATA_JWT="${PINATA_JWT}" -e PINATA_GATEWAY="${PINATA_GATEWAY}" -e SOLANA_RPC_URL="${SOLANA_RPC_URL}" -e PLATFORM_FEE="${PLATFORM_FEE}" -e PLATFORM_WALLET="${PLATFORM_WALLET}" sol_tool_manager_backend 
          docker logs --tail 150 sol_backend 
          EOF
