# .github/workflows/ci.yml
name: CI — Lint & Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-format:
    name: Lint & Format (ESLint + Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'        # set version you use

      - name: Install dependencies
        run: npm ci               # or `npm install` / `yarn install` as per your project

      - name: Run linters and formatter
        # You can run ESLint then Prettier; this fails the job if any errors found
        run: |
          npx eslint . --max-warnings 0
          npx prettier --check .
     
